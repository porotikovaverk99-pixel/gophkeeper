name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: |
          go test ./... -race -count=1
          go test $(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...) \
            -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${TOTAL}%"
          awk -v total="$TOTAL" 'BEGIN { if (total+0 < 70) exit 1 }'

      - name: Build server
        run: go build -o gophkeeper-server ./cmd/gophkeeper-server

      - name: Build client
        run: |
          go build -ldflags "-X github.com/porotikovaverk99-pixel/gophkeeper/pkg/version.Version=ci -X github.com/porotikovaverk99-pixel/gophkeeper/pkg/version.BuildDate=ci" \
            -o gophkeeper-client ./cmd/gophkeeper-client
